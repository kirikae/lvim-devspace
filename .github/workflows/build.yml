name: Build and Publish Container Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run a weekly rebuild every Sunday at 02:00 UTC to pick up upstream security
    # patches from Alpine (tmux-ttyd) and UBI (nvim)
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      - name: Extract metadata for tmux-ttyd-injector image
        id: meta-tmux-ttyd-injector
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tmux-ttyd-injector
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.tag_version.outputs.new_version }},enable=${{ steps.tag_version.outputs.new_version != '' }}
            type=sha

      - name: Build and push tmux-ttyd-injector Image
        uses: docker/build-push-action@v5
        with:
          context: ./tmux-ttyd
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-tmux-ttyd-injector.outputs.tags }}
          labels: ${{ steps.meta-tmux-ttyd-injector.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # nvim/ is a single multi-stage Containerfile producing two images that differ
  # only by tag suffix. It gets its own job rather than sharing one with the
  # image above: the LSP stage is large enough to want a runner's disk to
  # itself, and the two builds have nothing to share.
  build-and-push-neovim:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY}"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      # The Containerfile is the single source of truth for the Neovim version,
      # because the same value has to reach the build (to fetch the tarball) and
      # the tags (to name the images). Read it rather than repeating it here.
      - name: Read Neovim version from the Containerfile
        id: neovim_version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG NEOVIM_VERSION=//p' nvim/Containerfile | head -1)"
          if [ -z "${version}" ]; then
            echo "could not read ARG NEOVIM_VERSION from nvim/Containerfile" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Extract metadata for neovim base image
        id: meta-neovim-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/neovim
          # Both images share one repository, so every tag carries the stage as
          # a suffix — without it the two builds would overwrite each other's
          # sha- and latest tags.
          flavor: |
            latest=false
            suffix=-base
          tags: |
            type=raw,value=${{ steps.neovim_version.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push neovim base image
        uses: docker/build-push-action@v5
        with:
          context: ./nvim
          file: ./nvim/Containerfile
          target: base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-neovim-base.outputs.tags }}
          labels: ${{ steps.meta-neovim-base.outputs.labels }}

      - name: Extract metadata for neovim lsp image
        id: meta-neovim-lsp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/neovim
          flavor: |
            latest=false
            suffix=-lsp
          tags: |
            type=raw,value=${{ steps.neovim_version.outputs.version }}
            type=raw,value=latest
            type=sha

      # Runs against the same Buildx instance as the step above, so the `base`
      # stage is served from BuildKit's local cache rather than rebuilt: the
      # published -lsp image is built on exactly the -base image just pushed.
      # That is also why this step must stay in the same job.
      - name: Build and push neovim lsp image
        uses: docker/build-push-action@v5
        with:
          context: ./nvim
          file: ./nvim/Containerfile
          target: lsp
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-neovim-lsp.outputs.tags }}
          labels: ${{ steps.meta-neovim-lsp.outputs.labels }}
