name: Build and Publish Container Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run a weekly rebuild every Sunday at 02:00 UTC to pick up upstream Alpine security patches
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      - name: Extract metadata for tmux-ttyd-injector image
        id: meta-tmux-ttyd-injector
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tmux-ttyd-injector
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag_version.outputs.new_version }},enable=${{ steps.tag_version.outputs.new_version != '' }}
            type=sha

      - name: Build and push tmux-ttyd-injector Image
        uses: docker/build-push-action@v5
        with:
          context: ./tmux-ttyd
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-tmux-ttyd-injector.outputs.tags }}
          labels: ${{ steps.meta-tmux-ttyd-injector.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max