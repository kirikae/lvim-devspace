name: Build and Publish Container Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run a weekly rebuild every Sunday at 02:00 UTC to pick up upstream security
    # patches from Alpine (tmux-ttyd) and UBI (nvim-udi)
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bump version and push tag
        id: tag_version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Free up runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY}"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase IMAGE_NAME
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >>${GITHUB_ENV}

      - name: Extract metadata for tmux-ttyd-injector image
        id: meta-tmux-ttyd-injector
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/tmux-ttyd-injector
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.tag_version.outputs.new_version }},enable=${{ steps.tag_version.outputs.new_version != '' }}
            type=sha

      - name: Build and push tmux-ttyd-injector Image
        uses: docker/build-push-action@v5
        with:
          context: ./tmux-ttyd
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-tmux-ttyd-injector.outputs.tags }}
          labels: ${{ steps.meta-tmux-ttyd-injector.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for nvim-udi-base image
        id: meta-nvim-udi-base
        uses: docker/metadata-action@v5
        with:
          images: |
            name=localhost:5000/nvim-udi-base
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nvim-udi-base,enable=${{ github.event_name != 'pull_request' }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.tag_version.outputs.new_version }},enable=${{ steps.tag_version.outputs.new_version != '' }}
            type=sha

      - name: Build and push nvim-udi-base Image
        uses: docker/build-push-action@v5
        with:
          context: ./nvim-udi/base
          file: ./nvim-udi/base/Containerfile
          push: true
          tags: ${{ steps.meta-nvim-udi-base.outputs.tags }}
          labels: ${{ steps.meta-nvim-udi-base.outputs.labels }}

      - name: Extract metadata for nvim-udi-ide image
        id: meta-nvim-udi-ide
        uses: docker/metadata-action@v5
        with:
          images: |
            name=localhost:5000/nvim-udi-ide
            name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/nvim-udi-ide,enable=${{ github.event_name != 'pull_request' }}
          tags: |
            type=raw,value=latest
            type=raw,value=v${{ steps.tag_version.outputs.new_version }},enable=${{ steps.tag_version.outputs.new_version != '' }}
            type=sha

      - name: Build and push nvim-udi-ide Image
        uses: docker/build-push-action@v5
        with:
          context: ./nvim-udi/ide
          file: ./nvim-udi/ide/Containerfile
          push: true
          build-args: |
            BASE_IMAGE=localhost:5000/nvim-udi-base:latest
          tags: ${{ steps.meta-nvim-udi-ide.outputs.tags }}
          labels: ${{ steps.meta-nvim-udi-ide.outputs.labels }}
